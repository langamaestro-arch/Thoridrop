name: Build Thoridrop (Minecraft 26.3)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: thoridrop
      - uses: actions/checkout@v4
        with:
          repository: NeoForgeMDKs/MDK-26.3-ModDevGradle
          path: mdk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure MDK and inject Thoridrop sources
        shell: bash
        run: |
          set -euo pipefail
          cd mdk
          sed -i 's/^mod_id=.*/mod_id=thoridrop/' gradle.properties
          sed -i 's/^mod_name=.*/mod_name=Thoridrop/' gradle.properties
          sed -i 's/^mod_group_id=.*/mod_group_id=com.langamaestro.thoridrop/' gradle.properties
          sed -i 's/^mod_version=.*/mod_version=0.1.0/' gradle.properties
          sed -i 's/^mod_license=.*/mod_license=MIT/' gradle.properties
          sed -i 's/^neo_version=.*/neo_version=26.3.0.102/' gradle.properties
          rm -rf src/main/java
          mkdir -p src/main/java
          cp -R ../thoridrop/src/main/java/. src/main/java/
          find src/main/resources -type f \( -name '*.toml' -o -name '*.json' \) -exec sed -i 's/examplemod/thoridrop/g; s/Example Mod/Thoridrop/g; s/Example mod description\./Thoridrop development build./g' {} +
          if [ -d src/main/resources/assets/examplemod ]; then
            mkdir -p src/main/resources/assets/thoridrop
            cp -R src/main/resources/assets/examplemod/. src/main/resources/assets/thoridrop/
            rm -rf src/main/resources/assets/examplemod
          fi
      - name: Run pure Java core logic tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-classes
          javac -d test-classes \
            thoridrop/src/main/java/com/langamaestro/thoridrop/DropSession.java \
            thoridrop/src/main/java/com/langamaestro/thoridrop/DropScheduler.java \
            thoridrop/src/main/java/com/langamaestro/thoridrop/RewardLedger.java \
            thoridrop/src/test/java/com/langamaestro/thoridrop/CoreLogicTest.java
          java -cp test-classes com.langamaestro.thoridrop.CoreLogicTest
      - name: Build with Gradle
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Thoridrop-development-jar
          path: mdk/build/libs/*.jar
          if-no-files-found: error
